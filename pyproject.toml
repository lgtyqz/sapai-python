[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sapai"
version = "0.1.0"
description = "Super Auto Pets simulation, data ingestion, search, and TensorFlow models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SAP AI contributors"}]
dependencies = []

[project.optional-dependencies]
ml = [
  "numpy>=1.26,<3",
  "tensorflow>=2.18,<2.22",
]
neon = [
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]
notebook = [
  "ipywidgets>=8.1,<9",
]
all = [
  "numpy>=1.26,<3",
  "tensorflow>=2.18,<2.22",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "ipywidgets>=8.1,<9",
]

[project.scripts]
sapai = "sapai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sapai = [
  "sim/rules/*.json",
  "visualization/static/*.css",
  "visualization/static/*.html",
  "visualization/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
